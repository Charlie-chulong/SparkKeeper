[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spark-keeper-local"
dynamic = ["version"]
description = "续火花助手 Windows 本地自用版"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2",
  "windows-toasts>=1.3,<2",
  "PySide6-Essentials>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "pyinstaller>=6.15,<7",
]

[project.scripts]
spark-keeper = "spark_keeper.__main__:main"
spark-keeper-worker = "spark_keeper.worker:main"

[tool.hatch.version]
path = "src/spark_keeper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/spark_keeper"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: requires the current public website and network access",
]

[tool.ruff]
target-version = "py312"
line-length = 100
